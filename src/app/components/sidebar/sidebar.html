<aside class="sidebar-container">
    <div class="px-6 mb-8">
        <div class="flex items-center gap-3">
            <div>
                <h2 class="text-lg font-headline font-semibold text-primary leading-tight">Mind Refresh</h2>
                <p class="text-xs text-on-surface-variant font-medium">Corporate Wellness</p>
                <!-- Debug Tag (Delete after fix) -->
                <p class="text-[8px] bg-secondary/10 text-secondary px-1 rounded mt-1" *ngIf="currentUser$ | async as user">
                   Role: {{ user.role }} | {{ user.email }}
                </p>
            </div>
        </div>
    </div>

    <nav class="flex-1 px-2 space-y-1" *ngIf="currentUser$ | async as user">
        <a routerLink="/collaborator-dashboard"
           routerLinkActive="sidebar-link-active"
           class="sidebar-link">
            <span class="material-symbols-outlined mr-3">dashboard</span>
            Dashboard
        </a>

        <a *ngIf="user.role?.toLowerCase() === 'administrador' || user.role?.toLowerCase() === 'admin'"
           routerLink="/sentiment-analytics"
           routerLinkActive="sidebar-link-active"
           class="sidebar-link">
            <span class="material-symbols-outlined mr-3">sentiment_satisfied</span>
            Insights
        </a>

        <a routerLink="/event-catalog"
           routerLinkActive="sidebar-link-active"
           [routerLinkActiveOptions]="{exact: false}"
           class="sidebar-link">
            <span class="material-symbols-outlined mr-3">calendar_month</span>
            Events
        </a>

        <a *ngIf="['administrador', 'admin', 'líder', 'leader'].includes(user.role?.toLowerCase())"
           routerLink="/event-management"
           routerLinkActive="sidebar-link-active"
           class="sidebar-link">
            <span class="material-symbols-outlined mr-3">event_note</span>
            Manage Events
        </a>

        <a *ngIf="['administrador', 'admin', 'líder', 'leader'].includes(user.role?.toLowerCase())"
           routerLink="/strategic-dashboard"
           routerLinkActive="sidebar-link-active"
           class="sidebar-link">
            <span class="material-symbols-outlined mr-3">query_stats</span>
            Strategic Analytics
        </a>

        <a *ngIf="user.role?.toLowerCase() === 'administrador' || user.role?.toLowerCase() === 'admin'"
           routerLink="/user-management"
           routerLinkActive="sidebar-link-active"
           class="sidebar-link">
            <span class="material-symbols-outlined mr-3">group</span>
            User Sinergy
        </a>
    </nav>

    <div class="px-4 mt-auto">
        <button routerLink="/emotional-record" class="neo-btn w-full py-3 px-4 rounded-xl flex items-center justify-center gap-2 text-primary font-semibold">
            <span class="material-symbols-outlined text-[20px]">add</span>
            New Check-in
        </button>
    </div>
</aside>
