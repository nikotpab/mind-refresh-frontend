<header class="topbar-container">
    <!-- Page Title -->
    <h2 class="topbar-title">{{ pageTitle }}</h2>

    <!-- Right Actions -->
    <div class="topbar-actions">
        <!-- Notifications -->
        <button class="topbar-icon-btn" aria-label="Notifications">
            <span class="material-symbols-outlined">notifications</span>
            <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>

        <!-- Profile -->
        <div class="profile-wrapper">
            <!-- Backdrop to close dropdown -->
            <div class="profile-backdrop" *ngIf="profileMenuOpen" (click)="closeProfileMenu()"></div>

            <button class="topbar-avatar-btn" (click)="toggleProfileMenu()" aria-label="Profile menu">
                <img alt="Profile" class="topbar-avatar"
                     [src]="(currentUser$ | async)?.photoUrl || '/default-avatar.png'"/>
            </button>

            <!-- Dropdown Menu -->
            <div class="profile-dropdown" *ngIf="profileMenuOpen">
                <div class="profile-dropdown-header">
                    <img alt="Profile" class="dropdown-avatar"
                         [src]="(currentUser$ | async)?.photoUrl || '/default-avatar.png'"/>
                    <div *ngIf="currentUser$ | async as user">
                        <p class="dropdown-name">{{ user.name || 'User' }}</p>
                        <p class="dropdown-email">{{ user.email }}</p>
                    </div>
                </div>
                <div class="dropdown-divider"></div>
                <a routerLink="/profile" class="dropdown-item" (click)="closeProfileMenu()">
                    <span class="material-symbols-outlined dropdown-icon">manage_accounts</span>
                    Manage Profile
                </a>
                <button class="dropdown-item dropdown-logout" (click)="logout()">
                    <span class="material-symbols-outlined dropdown-icon">logout</span>
                    Log Out
                </button>
            </div>
        </div>
    </div>
</header>
