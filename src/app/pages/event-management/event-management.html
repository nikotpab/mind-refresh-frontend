<main class="p-6 md:p-8 max-w-7xl mx-auto space-y-8">
    <header class="flex justify-between items-center">
        <h1 class="text-3xl font-headline font-bold text-on-surface">Gestión de Eventos</h1>
        <button (click)="showForm = !showForm" class="neo-button bg-primary text-on-primary px-6 py-2 rounded-full font-bold">
            {{ showForm ? 'Cancelar' : 'Crear Evento' }}
        </button>
    </header>

    @if (showForm) {
        <section class="neo-raised rounded-3xl p-8 max-w-2xl mx-auto">
            <h2 class="text-2xl font-headline font-bold mb-6">Nuevo Evento</h2>
            <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold mb-2">Título</label>
                    <input formControlName="title" type="text" class="w-full neo-inset bg-surface rounded-xl p-3 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Descripción</label>
                    <textarea formControlName="description" rows="3" class="w-full neo-inset bg-surface rounded-xl p-3 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Fecha y Hora</label>
                    <input formControlName="date" type="datetime-local" class="w-full neo-inset bg-surface rounded-xl p-3 focus:outline-none">
                </div>
                <button type="submit" [disabled]="eventForm.invalid" class="w-full neo-button bg-primary text-on-primary py-3 rounded-xl font-bold disabled:opacity-50">
                    Guardar Evento
                </button>
            </form>
        </section>
    }

    <section class="grid grid-cols-1 gap-6">
        @for (event of events; track event.id) {
            <div class="neo-raised rounded-2xl p-6 flex justify-between items-center">
                <div>
                    <h3 class="text-xl font-bold">{{ event.title }}</h3>
                    <p class="text-on-surface-variant text-sm">{{ event.description }}</p>
                    <p class="text-primary text-xs font-bold mt-2">{{ event.date | date:'medium' }}</p>
                </div>
                <button (click)="deleteEvent(event.id)" class="text-error hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            </div>
        } @empty {
            <p class="text-center py-10 italic">No hay eventos registrados.</p>
        }
    </section>
</main>
