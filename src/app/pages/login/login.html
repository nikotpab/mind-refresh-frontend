<!-- Main Container -->
<main class="w-full max-w-md mx-auto min-h-screen flex flex-col justify-center p-4">
    <!-- Neomorphic Card -->
    <div
        class="bg-surface rounded-xl p-8 shadow-[6px_6px_12px_rgba(0,0,0,0.08),-6px_-6px_12px_rgba(255,255,255,0.6)] flex flex-col gap-8">
        <!-- Header Section -->
        <header class="text-center">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface shadow-[6px_6px_12px_rgba(0,0,0,0.08),-6px_-6px_12px_rgba(255,255,255,0.6)] mb-4">
                <span class="material-symbols-outlined text-3xl text-primary" data-icon="spa">spa</span>
            </div>
            <h1 class="font-headline text-2xl font-semibold text-on-surface mb-2">Mind Refresh</h1>
            <p class="font-body text-on-surface-variant text-sm">Acceso al Ecosistema de Bienestar</p>
        </header>
        <!-- Authentication Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
            @if (error) {
                <div class="text-error text-sm text-center font-medium">{{ error }}</div>
            }
            
            <!-- Name Input (Register only) -->
            <div class="flex flex-col gap-2" *ngIf="!isLogin">
                <label class="font-label text-sm font-medium text-on-surface-variant px-1" for="name">Nombre Completo</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-4 text-on-surface-variant" data-icon="person">person</span>
                    <input formControlName="name" class="w-full bg-surface text-on-surface pl-12 pr-4 py-3 rounded-lg border-none focus:ring-0 shadow-[inset_4px_4px_8px_rgba(0,0,0,0.06),inset_-4px_-4px_8px_rgba(255,255,255,0.5)] placeholder-on-surface-variant/50 focus:outline-none transition-shadow" id="name" placeholder="Juan Pérez" type="text" />
                </div>
            </div>

            <!-- Role Input (Register only) -->
            <div class="flex flex-col gap-2" *ngIf="!isLogin">
                <label class="font-label text-sm font-medium text-on-surface-variant px-1" for="role">Rol</label>
                <select formControlName="role" class="w-full bg-surface text-on-surface px-4 py-3 rounded-lg border-none focus:ring-0 shadow-[inset_4px_4px_8px_rgba(0,0,0,0.06),inset_-4px_-4px_8px_rgba(255,255,255,0.5)] focus:outline-none transition-shadow">
                    <option value="Colaborador">Colaborador</option>
                    <option value="Líder">Líder</option>
                    <option value="Administrador">Administrador</option>
                </select>
            </div>

            <!-- Email Input -->
            <div class="flex flex-col gap-2">
                <label class="font-label text-sm font-medium text-on-surface-variant px-1" for="email">Correo
                    Corporativo</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-4 text-on-surface-variant"
                        data-icon="mail">mail</span>
                    <input
                        formControlName="email"
                        class="w-full bg-surface text-on-surface pl-12 pr-4 py-3 rounded-lg border-none focus:ring-0 shadow-[inset_4px_4px_8px_rgba(0,0,0,0.06),inset_-4px_-4px_8px_rgba(255,255,255,0.5)] placeholder-on-surface-variant/50 focus:outline-none transition-shadow"
                        id="email" name="email" placeholder="nombre@empresa.com" type="email" />
                </div>
            </div>
            <!-- Password Input -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center px-1">
                    <label class="font-label text-sm font-medium text-on-surface-variant"
                        for="password">Contraseña</label>
                    <a class="font-label text-xs font-medium text-primary hover:text-tertiary transition-colors"
                        href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-4 text-on-surface-variant"
                        data-icon="lock">lock</span>
                    <input
                        formControlName="password"
                        class="w-full bg-surface text-on-surface pl-12 pr-4 py-3 rounded-lg border-none focus:ring-0 shadow-[inset_4px_4px_8px_rgba(0,0,0,0.06),inset_-4px_-4px_8px_rgba(255,255,255,0.5)] placeholder-on-surface-variant/50 focus:outline-none transition-shadow"
                        id="password" name="password" placeholder="••••••••" type="password" />
                </div>
            </div>
            <!-- Submit Button -->
            <button
                [disabled]="!loginForm.valid"
                class="w-full mt-2 bg-surface text-primary font-label font-semibold py-3 px-6 rounded-lg shadow-[6px_6px_12px_rgba(0,0,0,0.08),-6px_-6px_12px_rgba(255,255,255,0.6)] active:shadow-[inset_4px_4px_8px_rgba(0,0,0,0.06),inset_-4px_-4px_8px_rgba(255,255,255,0.5)] transition-all duration-200 flex justify-center items-center gap-2 disabled:opacity-50"
                type="submit">
                <span>{{ isLogin ? 'Iniciar Sesión' : 'Registrarse' }}</span>
            </button>
            
            <div class="text-center mt-4">
                <button type="button" (click)="toggleMode()" class="text-sm text-primary font-medium hover:underline">
                    {{ isLogin ? '¿No tienes cuenta? Regístrate' : '¿Ya tienes cuenta? Inicia sesión' }}
                </button>
            </div>
        </form>
        <!-- Divider -->
        <!-- SSO Integration -->
    </div>
    <!-- Privacy Disclaimer -->
    <div class="mt-8 text-center px-4 flex flex-col items-center gap-2">
        <span class="material-symbols-outlined text-on-surface-variant/70 text-xl"
            data-icon="shield_lock">shield_lock</span>
        <p class="font-body text-xs text-on-surface-variant leading-relaxed">
            Tus datos emocionales individuales son tratados de forma anónima en reportes grupales.
        </p>
    </div>
</main>
