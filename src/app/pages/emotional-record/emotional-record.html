<!-- Top App Bar (Hidden on this specific task flow, or minimal if needed. Omitting per "Transactional/Task-focused" rule) -->
<!-- Main Content Canvas -->
<main class="w-full max-w-2xl mx-auto flex flex-col gap-8">
    <!-- Header Section -->
    <header class="text-center mb-4">
        <h1 class="text-3xl md:text-4xl font-headline font-semibold text-primary mb-3">¿Cómo te sientes hoy?</h1>
        <p class="text-on-surface-variant font-medium text-lg">Selecciona la emoción que mejor represente tu estado
            actual. Esto nos ayuda a adaptar tu experiencia.</p>
    </header>
    <!-- Emotion Selector Component -->
    <section class="bg-surface neo-raised rounded-[2rem] p-8 flex flex-col items-center gap-10">
        <div class="flex justify-between w-full max-w-lg px-2">
            <!-- Option 1: Very Sad -->
            <button
                class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-surface neo-raised flex items-center justify-center text-on-surface-variant hover:text-primary transition-all duration-300 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                <span class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform"
                    data-icon="sentiment_very_dissatisfied">sentiment_very_dissatisfied</span>
            </button>
            <!-- Option 2: Sad -->
            <button
                class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-surface neo-raised flex items-center justify-center text-on-surface-variant hover:text-primary transition-all duration-300 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                <span class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform"
                    data-icon="sentiment_dissatisfied">sentiment_dissatisfied</span>
            </button>
            <!-- Option 3: Neutral (Active State Example) -->
            <button
                class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-surface neo-pressed flex items-center justify-center text-primary transition-all duration-300 group focus:outline-none">
                <span class="material-symbols-outlined text-4xl" data-icon="sentiment_neutral"
                    style="font-variation-settings: 'FILL' 1;">sentiment_neutral</span>
            </button>
            <!-- Option 4: Happy -->
            <button
                class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-surface neo-raised flex items-center justify-center text-on-surface-variant hover:text-primary transition-all duration-300 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                <span class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform"
                    data-icon="sentiment_satisfied">sentiment_satisfied</span>
            </button>
            <!-- Option 5: Very Happy -->
            <button
                class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-surface neo-raised flex items-center justify-center text-on-surface-variant hover:text-primary transition-all duration-300 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                <span class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform"
                    data-icon="sentiment_very_satisfied">sentiment_very_satisfied</span>
            </button>
        </div>
        <div class="w-full flex justify-between text-sm text-on-surface-variant font-label px-4 max-w-lg">
            <span>Muy triste</span>
            <span>Triste</span>
            <span>Neutral</span>
            <span>Feliz</span>
            <span>Muy feliz</span>
        </div>
        <!-- Optional Text Area -->
        <div class="w-full mt-4">
            <label class="sr-only" for="optional-notes">Cuéntanos más (opcional)</label>
            <textarea
                class="w-full bg-surface neo-pressed rounded-2xl p-5 text-on-surface placeholder-on-surface-variant border-none focus:ring-0 resize-none font-body text-base"
                id="optional-notes" placeholder="Cuéntanos más (opcional)" rows="4"></textarea>
        </div>
        <!-- Submit Action -->
        <button
            class="mt-4 px-10 py-4 bg-surface neo-raised rounded-full text-primary font-semibold text-lg hover:shadow-[inset_4px_4px_8px_rgba(0,0,0,0.06),inset_-4px_-4px_8px_rgba(255,255,255,0.5)] active:scale-95 transition-all duration-300 flex items-center gap-3 w-full md:w-auto justify-center">
            <span class="material-symbols-outlined" data-icon="send">send</span>
            Enviar Registro
        </button>
    </section>
    <!-- Temporary back button to simulate "Task-focused" exit -->
    <div class="text-center mt-8">
        <button
            class="text-on-surface-variant font-medium hover:text-primary transition-colors inline-flex items-center gap-2">
            <span class="material-symbols-outlined text-sm" data-icon="arrow_back">arrow_back</span>
            Cancelar
        </button>
    </div>
</main>
