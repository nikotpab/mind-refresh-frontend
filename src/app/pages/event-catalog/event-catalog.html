<main class="p-6 md:p-8 max-w-7xl mx-auto space-y-8">
    <section aria-label="Event Filters">
        <div class="flex flex-wrap gap-4">
            <button class="neo-button active bg-surface text-primary font-semibold px-6 py-2.5 rounded-full text-sm flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">calendar_month</span>
                Todos
            </button>
        </div>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        @for (event of events; track event.id) {
            <article class="neo-raised rounded-3xl p-6 flex flex-col justify-between relative overflow-hidden group">
                <div class="flex justify-between items-start mb-6 z-10 relative">
                    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full neo-inset text-tertiary text-xs font-bold uppercase tracking-wider">
                        <span class="material-symbols-outlined text-sm">model_training</span>
                        Evento
                    </div>
                    <div class="w-10 h-10 rounded-full neo-raised flex items-center justify-center text-primary group-hover:scale-110 transition-transform cursor-pointer">
                        <span class="material-symbols-outlined">bookmark_border</span>
                    </div>
                </div>
                <div class="z-10 relative">
                    <h3 class="text-xl font-headline font-bold text-on-surface mb-3">{{ event.title }}</h3>
                    <p class="text-on-surface-variant mb-6 text-sm leading-relaxed">{{ event.description }}</p>
                    <div class="flex items-center gap-2 text-sm font-medium text-on-surface-variant mb-6">
                        <span class="material-symbols-outlined text-primary">schedule</span>
                        {{ event.date | date:'medium' }}
                    </div>
                    <div class="flex gap-2">
                        <button class="neo-button flex-1 bg-surface text-primary font-bold py-3 rounded-xl flex items-center justify-center gap-2">
                            Inscribirme
                            <span class="material-symbols-outlined">how_to_reg</span>
                        </button>
                        <button (click)="inviteUser(event)" class="neo-button px-4 bg-surface text-tertiary font-bold py-3 rounded-xl flex items-center justify-center gap-2" title="Invitar a alguien">
                            <span class="material-symbols-outlined">person_add</span>
                        </button>
                    </div>
                </div>
            </article>
        } @empty {
            <div class="col-span-3 text-center py-20">
                <p class="text-on-surface-variant text-xl font-medium italic">No hay eventos disponibles en este momento.</p>
            </div>
        }
    </section>
</main>
